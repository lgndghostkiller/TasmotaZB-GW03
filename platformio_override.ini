; baue eine TCP-Variante auf Basis des ESP32-Zigbee-Bridge-Targets
[env:tasmota32-zigbee-tcp]
extends = env:tasmota32-zigbeebridge
platform = ${common.platform_esp32}     ; WICHTIG: nicht 8266
board = esp32dev                        ; oder dein konkretes ESP32-Board
build_flags =
  ${env:tasmota32-zigbeebridge.build_flags}
  -DUSE_TCP_BRIDGE
; optional, wenn du LAN willst:
;  -DUSE_ETHERNET
;  -DUSE_LAN8720
