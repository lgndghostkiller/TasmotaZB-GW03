[platformio]
src_dir = tasmota

[env:tasmota32-zigbee-tcp]
extends = env:tasmota32-zigbeebridge   ; <<< MUSS DRIN SEIN!

platform  = espressif32@6.5.0
board     = esp32dev
framework = arduino

lib_ldf_mode = deep+

build_flags =
    ${env:tasmota32-zigbeebridge.build_flags}

    ; === SD KOMPLETT DEAKTIVIEREN (FIX FÜR SD_MMC.h!) ===
    -UUSE_SD_CARD
    -UUSE_SD_CARD_MMC    ; <<< DIESE ZEILE FEHLTE!
    -UUSE_SDCARD

    ; === ZIGBEE EZSP + TCP BRIDGE ===
    -DUSE_ZIGBEE
    -DUSE_ZIGBEE_EZSP
    -DUSE_TCP_BRIDGE
    -DUSE_ZIGBEE_CHANNEL=11
    -DROTATE_ZIGBEE

    ; === HARDWARE: ZB-GW03 ===
    -DUSE_ETHERNET
    -DETH_TYPE=0
    -DETH_CLKMODE=3
    -DUSE_ZIGBEE_EEPROM

    ; === DATEISYSTEM ===
    -DUSE_UFILESYS
    -DUSE_LITTLEFS

    ; === MINIMALES LOGGING ===
    -DSERIAL_LOG_LEVEL=0

    ; === UNNÖTIGE FEATURES DEAKTIVIEREN ===
    -UUSE_ZIGBEE_ZNP
    -UUSE_TLS
    -UUSE_BERRY
    -UUSE_BERRY_PSRAM
    -UUSE_SCRIPT
    -UUSE_DISPLAY
    -UUSE_IR_REMOTE
    -UUSE_IR_REMOTE_FULL

    ; === GPIO: EZSP UART ===
    -DZIGBEE_DOUT_GPIO=1
    -DZIGBEE_DIN_GPIO=3

    ; === Header-Pfad ===
    -I tasmota/include
