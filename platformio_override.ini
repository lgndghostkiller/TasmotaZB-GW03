[platformio]
; Quellen liegen im Ordner "tasmota"
src_dir = tasmota

[env:tasmota32-zigbee-tcp]
extends   = env:tasmota32-zigbeebridge
platform  = espressif32@6.5.0
board     = esp32dev
framework = arduino

; Berry-Dateien vor dem Build rausfiltern (aktualisierte Version!)
extra_scripts =
  pre:tools/filter_no_berry.py

; KNX bewusst draußen lassen
lib_ignore =
  ESP KNX IP Library

lib_ldf_mode = deep+

build_flags =
  ${env:tasmota32-zigbeebridge.build_flags}
  -O2

  ; Features AN
  -DUSE_ZIGBEE
  -DUSE_ZIGBEE_EZSP
  -DUSE_TCP_BRIDGE
  -DCONFIG_TASMOTA_FLASHMODE_DIO

  ; Features AUS
  -UUSE_ZIGBEE_ZNP
  -UUSE_TLS
  -UUSE_SDCARD

   ; >>> WICHTIG: Header-Pfade, damit die Includes sicher gefunden werden
   -I tasmota/include
   -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD_MMC/src

   ; >>> Core 2.0.14 liefert keinen ESP_ARDUINO_VERSION_STR – wir definieren ihn
    -DESP_ARDUINO_VERSION_STR=\"2.0.14\"

build_unflags =
  -std=gnu++11

; KEIN build_src_filter hier – kompletter Quellbaum, Berry via Pre-Script raus
