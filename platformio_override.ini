[platformio]
src_dir = tasmota

[env:tasmota32-zigbee-tcp]
extends = env:tasmota32-zigbeebridge   ; WICHTIG: Alle Basis-Flags von Tasmota übernehmen!

platform  = espressif32@6.5.0
board     = esp32dev
framework = arduino

lib_ldf_mode = deep+

build_flags =
    ${env:tasmota32-zigbeebridge.build_flags}  ; Alle Standard-Flags behalten

    ; === Optimierung ===
    -O2
    -DCONFIG_TASMOTA_FLASHMODE_DIO

    ; === ZIGBEE EZSP + TCP BRIDGE ===
    -DUSE_ZIGBEE
    -DUSE_ZIGBEE_EZSP
    -DUSE_TCP_BRIDGE
    -DUSE_ZIGBEE_CHANNEL=11
    -DROTATE_ZIGBEE

    ; === HARDWARE: ZB-GW03 ===
    -DUSE_ETHERNET
    -DETH_TYPE=0
    -DETH_CLKMODE=3
    -DUSE_ZIGBEE_EEPROM

    ; === DATEISYSTEM ===
    -DUSE_UFILESYS
    -DUSE_LITTLEFS

    ; === SD KARTE KOMPLETT DEAKTIVIEREN (verhindert SD_MMC.h Fehler!) ===
    -UUSE_SD_CARD
    -UUSE_SD_CARD_MMC
    -UUSE_SDCARD

    ; === UNNÖTIGE FEATURES DEAKTIVIEREN ===
    -UUSE_ZIGBEE_ZNP
    -UUSE_TLS
    -UUSE_BERRY
    -UUSE_BERRY_PSRAM
    -UUSE_SCRIPT
    -UUSE_DISPLAY
    -UUSE_IR_REMOTE
    -UUSE_IR_REMOTE_FULL
    -UUSE_EMULATION
    -UUSE_EMULATION_HUE
    -UUSE_EMULATION_WEMO

    ; === MINIMALES LOGGING ===
    -DSERIAL_LOG_LEVEL=0

    ; === GPIO: EZSP UART (ZB-GW03 v1.2) ===
    -DZIGBEE_DOUT_GPIO=1
    -DZIGBEE_DIN_GPIO=3

    ; === Header-Suchpfad ===
    -I tasmota/include
