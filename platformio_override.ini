[env:tasmota32-zigbee-tcp]
extends = env:tasmota32-zigbeebridge
platform = espressif32@6.6.0

; Erzwinge Arduino-ESP32 v3.x (anstatt 2.0.14)
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.7

board = esp32dev
framework = arduino

lib_ldf_mode = deep+
lib_ignore = 
  ESP KNX IP Library

; ---- Compiler/Std & Flashmode ----
build_unflags =
  -std=gnu++11
  -DUSE_ZIGBEE_ZNP
  -DUSE_BERRY
  -DUSE_TLS
  -DUSE_SDCARD

build_flags =
  ${env:tasmota32-zigbeebridge.build_flags}
  -O2
  -std=gnu++14

  ; Flashmode explizit (muss früh definiert sein)
  -DCONFIG_TASMOTA_FLASHMODE_DIO

  ; ---- Features AN ----
  -DUSE_ZIGBEE
  -DUSE_ZIGBEE_EZSP
  -DUSE_TCP_BRIDGE

  ; ---- Features AUS / Guards ----
  -UUSE_ZIGBEE_ZNP
  -UUSE_TLS
  -UUSE_SDCARD
  -DSOC_SDMMC_HOST_SUPPORTED=0

  ; ---- Typedef-Fixes ----
  -Dsint8_t=int8_t
  -Dsint16_t=int16_t
  -Dsint32_t=int32_t

  ; ---- Header-Pfade ----
  -I tasmota/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/cores/esp32
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/HTTPClient/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/HTTPUpdate/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Update/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/spi_flash/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/esp_partition/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/nvs_flash/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/app_update/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/esp_hw_support/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/hal/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/soc/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/freertos/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/esp_common/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/esp_rom/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/xtensa/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/newlib/platform_include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/log/include

; --- Berry komplett filtern (dein Script ist aktiv) ---
extra_scripts = pre:tools/filter_no_berry.py

; --- Nur Tasmota-Quellen rein ---
build_src_filter =
  +<tasmota/*>
  -<**/xdrv_52_*.ino>
  -<**/*berry*.ino>
  -<**/xsns_92_berry*.ino>
  -<**/xbp_berry*.ino>
