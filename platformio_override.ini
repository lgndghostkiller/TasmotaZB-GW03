[platformio]
src_dir = tasmota

[env:tasmota32-zigbee-tcp]
platform  = espressif32@6.5.0      ; Arduino-ESP32 2.0.14
board     = esp32dev
framework = arduino

; KEIN extra_scripts / KEIN src_filter!

lib_ldf_mode = deep+

build_flags =
  -O2
  -DARDUINO_ARCH_ESP32
  -DARDUINO_CORE_RELEASE="2.0.14"
  -DCONFIG_TASMOTA_FLASHMODE_DIO

  ; Features an
  -DUSE_ZIGBEE
  -DUSE_ZIGBEE_EZSP
  -DUSE_TCP_BRIDGE

  ; Features aus
  -UUSE_ZIGBEE_ZNP
  -UUSE_TLS
  -UUSE_SDCARD
  -UUSE_BERRY

  ; Header-Suchpfad für lokale Includes
  -I tasmota/include

; Keine build_unflags nötig
