[platformio]
; stellt sicher, dass PIO im Ordner "tasmota" nach Quellen sucht
src_dir = tasmota

[env:tasmota32-zigbee-tcp]
extends   = env:tasmota32-zigbeebridge
platform  = espressif32@6.5.0      ; => Arduino Core 2.0.14 (stabil, keine -libs Nebenpakete)
board     = esp32dev
framework = arduino

; keine fremden platform_packages hier!

; Berry-Dateien sauber vor dem Build rausfiltern
extra_scripts = 
  pre:tools/filter_no_berry.py

lib_ldf_mode = deep+

lib_ignore =
  ESP KNX IP Library

build_flags =
  ${env:tasmota32-zigbeebridge.build_flags}
  -O2

  ; ---- Features AN ----
  -DUSE_ZIGBEE
  -DUSE_ZIGBEE_EZSP
  -DUSE_TCP_BRIDGE

  ; ---- Features AUS / Guards ----
  -UUSE_ZIGBEE_ZNP
  -UUSE_TLS
  -UUSE_SDCARD
  -DSOC_SDMMC_HOST_SUPPORTED=0

  ; ---- Typedef-Fixes ----
  -Dsint8_t=int8_t
  -Dsint16_t=int16_t
  -Dsint32_t=int32_t

  ; ---- Flashmode-Fix für Tasmota ----
  -DCONFIG_ESPTOOLPY_FLASHMODE_DIO=1

; WICHTIG: KEIN build_src_filter hier setzen!
; Tasmota braucht den kompletten Quellbaum, der Berry-Ausschluss erfolgt über das Pre-Script.
