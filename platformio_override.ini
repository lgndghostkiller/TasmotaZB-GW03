[env:tasmota32-zigbee-tcp]
extends = env:tasmota32-zigbeebridge
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
lib_ldf_mode = deep+
lib_ignore =
  ESP KNX IP Library
build_flags =
  ${env:tasmota32-zigbeebridge.build_flags}
  ${common.build_flags}
  -O2
  -DUSE_TCP_BRIDGE
  -DUSE_ZIGBEE
  -DUSE_ZIGBEE_EZSP
  -UUSE_ZIGBEE_ZNP
  -UUSE_BERRY
  -Dsint8_t=int8_t
  -Dsint16_t=int16_t
  -Dsint32_t=int32_t
  -I tasmota/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/HTTPClient/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/HTTPUpdate/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Update/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/cores/esp32
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD_MMC/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/spi_flash/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/esp_partition/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/nvs_flash/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/app_update/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/spi_flash/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/esp_hw_support/include   ; esp_cpu_utils.h
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/hal/include              ; hal/*.h
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/soc/include              ; soc/*.h
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/freertos/include         ; FreeRTOS headers
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/esp_common/include       ; esp_err.h etc.
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/esp_rom/include          ; esp_rom/*.h
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/xtensa/include           ; xtensa headers
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/newlib/platform_include  ; stdint config
  -I ${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/log/include              ; esp_log.h

build_unflags =
  -DUSE_ZIGBEE_ZNP
  -DUSE_BERRY
  
; optional:
; board_build.partitions = tasmota32.default.partitions

; Optional: LAN-Unterstützung (nur wenn wirklich nötig)
;  -DUSE_ETHERNET
;  -DUSE_LAN8720
