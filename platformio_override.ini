[env:tasmota32-zigbee-tcp]
extends = env:tasmota32-zigbeebridge
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
lib_ldf_mode = deep+
lib_ignore = 
  ESP KNX IP Library
build_flags =
  ${env:tasmota32-zigbeebridge.build_flags}
  ${common.build_flags}
  -DUSE_TCP_BRIDGE
  -Dsint8_t=int8_t
  -Dsint16_t=int16_t
  -Dsint32_t=int32_t
  -I tasmota/include
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/HTTPClient/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/HTTPUpdate/src   ; <<< NEU


; Optional: LAN-Unterstützung (nur wenn wirklich nötig)
;  -DUSE_ETHERNET
;  -DUSE_LAN8720
