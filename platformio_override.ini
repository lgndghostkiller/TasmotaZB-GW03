[platformio]
; Quellen liegen im Ordner "tasmota"
src_dir = tasmota

[env:tasmota32-zigbee-tcp]
extends   = env:tasmota32-zigbeebridge
platform  = espressif32@6.5.0
board     = esp32dev
framework = arduino

; Berry-Dateien vor dem Build rausfiltern (aktualisierte Version!)
extra_scripts =
  pre:tools/filter_no_berry.py

; KNX bewusst draußen lassen
lib_ignore =
  ESP KNX IP Library

lib_ldf_mode = deep+

build_flags =
  ${env:tasmota32-zigbeebridge.build_flags}
  -O2

  ; Features AN
  -DUSE_ZIGBEE
  -DUSE_ZIGBEE_EZSP
  -DUSE_TCP_BRIDGE
  -DCONFIG_TASMOTA_FLASHMODE_DIO

  ; Features AUS
  -UUSE_ZIGBEE_ZNP
  -UUSE_TLS
  -UUSE_SDCARD

build_unflags =
  -std=gnu++11

; KEIN build_src_filter hier – kompletter Quellbaum, Berry via Pre-Script raus
