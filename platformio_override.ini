[platformio]
; stellt sicher, dass PIO im Ordner "tasmota" nach Quellen sucht
src_dir = tasmota

[env:tasmota32-zigbee-tcp]
extends   = env:tasmota32-zigbeebridge
platform  = espressif32@6.5.0      ; => Arduino Core 2.0.14 (stabil, keine -libs Nebenpakete)
board     = esp32dev
framework = arduino

; keine fremden platform_packages hier!

; Berry-Dateien sauber vor dem Build rausfiltern
extra_scripts = 
  pre:tools/filter_no_berry.py

lib_ldf_mode = deep+

build_flags =
  -O2
  -std=gnu++17

  ; === Flashmode-Fix (beide Defines, damit Tasmota + esptoolpy happy sind) ===
  -DCONFIG_TASMOTA_FLASHMODE_DIO=1
  -DCONFIG_ESPTOOLPY_FLASHMODE_DIO=1

  ; === Header-Suchpfade für Arduino-ESP32 (2.0.14) ===
  -I ${platformio.packages_dir}/framework-arduinoespressif32/cores/esp32
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/HTTPClient/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/HTTPUpdate/src
  -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Update/src

  ; falls dein Shim noch unter tasmota/include/ liegt:
  -I tasmota/include

  ; ---- Features AN ----
  -DUSE_ZIGBEE
  -DUSE_ZIGBEE_EZSP
  -DUSE_TCP_BRIDGE

  ; ---- Features AUS ----
  -UUSE_ZIGBEE_ZNP
  -UUSE_TLS
  -UUSE_SDCARD

  ; ---- Typedef-Fixes ----
  -Dsint8_t=int8_t
  -Dsint16_t=int16_t
  -Dsint32_t=int32_t

build_unflags =
  -std=gnu++11
  
; WICHTIG: KEIN build_src_filter hier setzen!
; Tasmota braucht den kompletten Quellbaum, der Berry-Ausschluss erfolgt über das Pre-Script.
