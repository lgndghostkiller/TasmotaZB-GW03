[env:tasmota32-zigbee-tcp]
extends = env:tasmota32-zigbeebridge
platform = espressif32@6.5.0          ; <-- explizit setzen
board = esp32dev
framework = arduino
build_flags =
  ${env:tasmota32-zigbeebridge.build_flags}
  -DUSE_TCP_BRIDGE
  ${common.build_flags}
  -Dsint8_t=int8_t
  -Dsint16_t=int16_t
  -Dsint32_t=int32_t

; optional, falls du später LAN brauchst:
;  -DUSE_ETHERNET
;  -DUSE_LAN8720
